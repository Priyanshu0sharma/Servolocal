name: Build Dual Android APKs (Customer + Partner)

on:
  push:
    branches:
      - main
    paths:
      - "mobile-apps/servolocal_flutter/**"
      - ".github/workflows/build-apks.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Compile Release APKs in Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17 for Android Gradle Compilation
      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 3. Setup Android SDK 36 for modern plugins (geolocator, shared_preferences)
      - name: Setup Android SDK 36 Platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || true

      # 4. Setup Flutter Environment
      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # 5. Fetch Flutter Dependencies
      - name: Fetch Flutter Dependencies
        working-directory: mobile-apps/servolocal_flutter
        run: |
          flutter pub get

      # 6. Build Customer Flavor APK (ServoLocal)
      - name: Build ServoLocal Customer APK
        working-directory: mobile-apps/servolocal_flutter
        run: |
          echo "Building Customer APK (ServoLocal)..."
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=APP_FLAVOR=customer \
            --dart-define=WEB_URL=https://servolocal.in \
            --dart-define=API_URL=https://servolocal-api.onrender.com

          mkdir -p ../../release-apks
          cp build/app/outputs/flutter-apk/app-release.apk ../../release-apks/ServoLocal-Customer-Release.apk
          echo "ServoLocal-Customer-Release.apk created successfully."

      # 7. Build Partner Flavor APK (ServoPartner)
      - name: Build ServoPartner Business & Fleet APK
        working-directory: mobile-apps/servolocal_flutter
        run: |
          echo "Building Partner APK (ServoPartner)..."
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=APP_FLAVOR=partner \
            --dart-define=WEB_URL=https://partner.servolocal.in \
            --dart-define=API_URL=https://servolocal-api.onrender.com

          cp build/app/outputs/flutter-apk/app-release.apk ../../release-apks/ServoPartner-Business-Release.apk
          echo "ServoPartner-Business-Release.apk created successfully."

      # 8. Upload Downloadable APK Artifacts (Single-Click Download on GitHub)
      - name: Upload Both Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: ServoLocal-Dual-APKs
          path: release-apks/*.apk
          retention-days: 30
          if-no-files-found: error

      # 9. Publish Direct Release APKs to GitHub Releases (on tag or manual dispatch)
      - name: Publish Direct Release APKs
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0-release' }}
          name: "ServoLocal Production APKs (${{ github.ref_name || 'v1.0.0' }})"
          body: |
            ### 📱 ServoLocal Production Android APKs
            
            - 🟢 **ServoLocal-Customer-Release.apk**: Customer Instant Delivery (15-20 Mins) + Pan-India Store.
            - 🟣 **ServoPartner-Business-Release.apk**: 3-in-1 Super-App for Shopkeepers (Seller Hub), Delivery Partners, and Admin.
            
            Directly download and install on any Android smartphone!
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
