name: servolocal_flutter
description: "ServoLocal Mobile Wrapper & Native Bridge App (Customer + Partner)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  http: ^1.2.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/customer_logo.jpeg
    - assets/partner_logo.jpeg

